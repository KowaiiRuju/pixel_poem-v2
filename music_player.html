<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player - Pixel Jukebox</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/music_player.css">
  <script src="scripts/music_player.js" defer></script>
  <style>
    body {
      background: linear-gradient(180deg, #d7ecff 0%, #ffe6f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: 'Tiny5', sans-serif;
    }
    #music-player-container {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      bottom: auto !important;
      left: auto !important;
      max-width: 380px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="music-player-container">
    <div id="music-player">
      <div class="player-top-row">
        <div id="music-logo">
          <img src="images/music_logo.png" alt="Music Logo" draggable="false" />
        </div>
        <div class="player-meta-box">
          <span class="player-status-tag">Pixel Jukebox</span>
          <span id="track-title">Now Playing: ...</span>
        </div>
        <button id="minimize-btn" aria-label="Minimize or Expand Player" title="Minimize / Expand Player">
          <span class="material-icons">expand_less</span>
        </button>
      </div>

      <audio id="audio" preload="none" aria-label="Audio Player"></audio>

      <!-- Progress Scrubber -->
      <div class="progress-container">
        <span id="current-time" class="time-label">0:00</span>
        <div class="progress-bar-wrapper" id="progress-wrapper" title="Seek track">
          <div class="progress-bar" id="progress-bar"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <span id="duration-time" class="time-label">0:00</span>
      </div>

      <!-- Player Controls -->
      <div id="player-controls">
        <button id="prev" aria-label="Previous Track" title="Previous Track"><span class="material-icons">skip_previous</span></button>
        <button id="play-pause" class="play-btn-primary" aria-label="Play/Pause" title="Play / Pause"><span class="material-icons">play_circle</span></button>
        <button id="next" aria-label="Next Track" title="Next Track"><span class="material-icons">skip_next</span></button>
        <div class="volume-group">
          <button id="mute-btn" aria-label="Mute / Unmute" title="Mute / Unmute"><span class="material-icons">volume_up</span></button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" aria-label="Volume Slider" title="Volume">
        </div>
      </div>

      <!-- Interactive Queue -->
      <div id="music-queue"></div>
    </div>
  </div>
</body>
</html>
